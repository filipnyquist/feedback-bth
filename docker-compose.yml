version: '3.8'

services:
  feedback-bth:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      # Mount database directory
      - ./data:/app/data
      # Mount .env file for configuration
      - ./backend/.env:/app/backend/.env:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/feedback.db
      - FRONTEND_DIST=/app/frontend/dist
      # Override these in production - set to your actual domain
      # - REDIRECT_URI=https://your-domain.com/api/auth/callback
      # - FRONTEND_ORIGIN=https://your-domain.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/programs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
